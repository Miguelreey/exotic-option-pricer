[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "exotic-option-pricer"
version = "5.0.0"
description = "Production-grade derivatives pricing library: BS-Merton analytical, Monte Carlo with variance reduction, Asian/Barrier/Lookback/Digital exotics, Heston (Fourier pricing, QE simulation, SPX calibration), rough Bergomi (hybrid scheme, conditional MC), numerical Greeks"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Miguel Rey"},
]
keywords = [
    "quantitative-finance",
    "options",
    "black-scholes",
    "greeks",
    "derivatives",
    "implied-volatility",
    "option-pricing",
    "monte-carlo",
    "variance-reduction",
    "exotic-options",
    "asian-options",
    "barrier-options",
    "lookback-options",
    "digital-options",
    "path-dependent",
    "heston",
    "stochastic-volatility",
    "rough-volatility",
    "rough-bergomi",
    "calibration",
    "fourier-pricing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Office/Business :: Financial :: Investment",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]
market = [
    "yfinance>=0.2",
]

[project.urls]
Repository = "https://github.com/Miguelreey/exotic-option-pricer"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]

[tool.mypy]
# No python_version pin: mypy must parse third-party stubs with the grammar
# of the environment it runs in. numpy >= 2.5 stubs use PEP 695 `type`
# statements, which mypy rejects under a 3.10 target — and "Python 3.10 +
# numpy 2.5" is not an installable environment anyway (numpy 2.5 dropped
# 3.10). Real 3.10 compatibility is covered by the CI test matrix and by
# ruff's target-version = "py310".
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
show_missing = true
